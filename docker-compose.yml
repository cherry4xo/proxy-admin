version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./proxy.db:/app/proxy.db
      - ./scripts:/app/scripts:ro
      - ./sa-key.json:/app/sa-key.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////app/proxy.db
